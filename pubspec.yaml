name: project_structure
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  #State management
  get: ^4.6.6

  #Http Request Api
  http: ^1.2.1

  #env
  flutter_dotenv: ^5.1.0

  flutter_slidable: ^4.0.3

  #Notification
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1
  
  #Storage
  shared_preferences: ^2.2.2
  get_storage: ^2.1.1
  

  #Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.2

  #Image Picker
  image_picker: ^1.2.1
  intl: ^0.20.2

  #Drawing
  signature: ^6.3.0
  path_provider: ^2.1.5

  #textEditor
  flutter_quill: ^11.5.0
  flutter_quill_extensions: ^11.0.0
  path: ^1.9.1
  flutter_colorpicker: ^1.1.0
  file_picker: ^11.0.2
  open_filex: ^4.7.0

  #Share
  share_plus: ^12.0.2
  
  #Sound
  audioplayers: ^6.7.0

  #Tootip
  showcaseview: ^5.0.2
  video_player: ^2.11.1

   #Scan text
  google_mlkit_text_recognition: ^0.15.1
  speech_to_text: ^7.4.0
  curved_labeled_navigation_bar: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints to
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0



# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/sounds/
    - assets/.env
    - lib/json/templates.json

  fonts:
    - family: KH-LIGHT
      fonts:
        - asset: assets/fonts/Battambang-Light.ttf
    - family: KH-REGULAR
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
    - family: KH-BOLD
      fonts:
        - asset: assets/fonts/Battambang-Bold.ttf
    - family: EN-REGULAR
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
    - family: EN-SEMIBOLD
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
    - family: EN-BOLD
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf



